<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH Desk</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/login.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/apps/files.css">
<link rel="stylesheet" href="/css/apps/editor.css">
<link rel="stylesheet" href="/css/apps/taskman.css">
<link rel="stylesheet" href="/css/apps/settings.css">
<link rel="stylesheet" href="/css/apps/notepad.css">
<link rel="stylesheet" href="/css/apps/terminal.css">
<link rel="stylesheet" href="/xterm/xterm.css">
</head>
<body>
<div id="desktop" hidden>
  <main id="windows"></main>
  <div id="start-menu" role="menu" aria-label="開始選單" hidden>
    <div class="sm-title">工具</div>
    <div id="sm-apps"></div>
    <div class="sm-sep"></div>
    <div id="sm-logout-row" hidden>
      <button type="button" id="disconnect" role="menuitem">登出</button>
    </div>
    <button type="button" id="sm-user" aria-expanded="false" title="帳號選項">
      <span class="avatar" id="sm-avatar"></span>
      <span class="who"><b id="sm-username"></b><small id="conn-label"></small></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  </div>
  <nav id="dock" aria-label="工作列">
    <button type="button" id="start-btn" aria-haspopup="menu" aria-expanded="false" title="選單" aria-label="選單">
      <svg viewBox="0 0 22 22" aria-hidden="true">
        <rect class="frame" x="1.5" y="1.5" width="19" height="19" rx="5.5"/>
        <circle class="d1" cx="7.4" cy="7.4" r="2.5"/>
        <circle class="d2" cx="14.6" cy="7.4" r="2.5"/>
        <circle class="d3" cx="7.4" cy="14.6" r="2.5"/>
      </svg>
    </button>
    <div id="dock-items"></div>
    <div id="clock" title=""><span id="clock-time"></span><span id="clock-date"></span></div>
  </nav>
</div>

<div id="login" class="overlay">
  <form id="login-form" class="card" autocomplete="on">
    <h1>SSH Desk</h1>
    <p class="sub" id="login-sub">連線到 SSH 主機，瀏覽並編輯上面的檔案</p>
    <div class="row">
      <label class="grow">主機位置
        <input id="f-host" name="host" required placeholder="example.com" autocapitalize="off" spellcheck="false">
      </label>
      <label class="port">連接埠
        <input id="f-port" name="port" type="number" min="1" max="65535" value="22" required>
      </label>
    </div>
    <label>帳號
      <input id="f-user" name="username" required autocomplete="username" autocapitalize="off" spellcheck="false">
    </label>
    <label><span id="pass-label">密碼</span>
      <input id="f-pass" name="password" type="password" autocomplete="current-password">
    </label>
    <div class="keyrow">
      <input type="file" id="f-key" hidden>
      <button type="button" id="key-pick">選擇私鑰檔…</button>
      <span id="key-name">未選擇（選填，改用金鑰登入）</span>
      <button type="button" id="key-clear" hidden>移除</button>
    </div>
    <div id="login-error" class="error" role="alert" hidden></div>
    <div id="hostkey-warn" class="warn" hidden>
      <strong>主機金鑰和上次不同</strong>
      <p>這台主機回報的金鑰指紋與瀏覽器記住的不一樣。可能是主機重灌或換了金鑰，也可能有人攔截連線。</p>
      <p class="fp">上次：<code id="fp-old"></code><br>這次：<code id="fp-new"></code></p>
      <button type="button" id="trust-new">信任新的金鑰並繼續</button>
    </div>
    <button type="submit" id="login-btn" class="primary">登入</button>
    <p class="note">密碼與私鑰只用於連線，不會被儲存；私鑰會傳到 Worker 進行登入。</p>
  </form>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="/vs/loader.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
